openapi: 3.0.3
info:
  title: Inventory Management API
  version: 1.0.0
  description: API documentation for Inventory Management system including Super Admin and tenant endpoints.
servers:
  - url: http://localhost:3001
tags:
  - name: Auth
  - name: SuperAdmin
  - name: Invoices
  - name: Purchases
  - name: Products
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200': { description: Login successful }
        '401': { description: Invalid credentials }
  /auth/admin/login:
    post:
      tags: [Auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200': { description: Login successful }
        '401': { description: Invalid credentials }
        '403': { description: Not an admin account }
  /super-admin/login:
    post:
      tags: [SuperAdmin]
      summary: Super admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200': { description: Login successful }
        '401': { description: Invalid credentials }
  /super-admin/orgs:
    get:
      tags: [SuperAdmin]
      summary: List organizations
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
    post:
      tags: [SuperAdmin]
      summary: Create organization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                apiBaseUrl: { type: string }
                adminEmail: { type: string }
                adminPassword: { type: string }
      responses:
        '201': { description: Created }
        '400': { description: Bad request }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
  /super-admin/orgs/{id}:
    get:
      tags: [SuperAdmin]
      summary: Get organization
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /super-admin/orgs/{id}/admins:
    get:
      tags: [SuperAdmin]
      summary: List org admins
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
    post:
      tags: [SuperAdmin]
      summary: Create org admin
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string }
                password: { type: string }
      responses:
        '201': { description: Created }
        '400': { description: Bad request }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
